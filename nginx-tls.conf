# TLS termination for Telegram webhook (self-signed, IP 2.72.83.118)
# Self-signed certs are accepted by Telegram when uploaded via setWebhook.
server {
    listen 443 ssl;
    server_name 2.72.83.118;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # API reverse proxy (same as the :80 block)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Health check over TLS
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
}
